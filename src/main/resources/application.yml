spring:
  application.name: voice-attribute-service
  servlet.multipart:
    max-file-size: ${MAX_FILE_SIZE:15MB}
    max-request-size: ${MAX_FILE_SIZE:15MB}
management.endpoints.web.exposure.include: health,metrics
management.endpoint.health.probes.enabled: true
server.error.include-message: never
voice:
  max-file-bytes: ${MAX_FILE_BYTES:15728640}
  max-audio-duration-seconds: ${MAX_AUDIO_DURATION_SECONDS:60}
  min-audio-duration-seconds: ${MIN_AUDIO_DURATION_SECONDS:1.0}
  inference-timeout-ms: ${INFERENCE_TIMEOUT_MS:15000}
  gender-confidence-threshold: ${GENDER_CONFIDENCE_THRESHOLD:0.60}
  age-confidence-threshold: ${AGE_CONFIDENCE_THRESHOLD:0.45}
  inference-service-url: ${INFERENCE_SERVICE_URL:http://localhost:8000}
