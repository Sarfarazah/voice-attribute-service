services:
  inference:
    build: ./inference
    environment:
      OMP_NUM_THREADS: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 30s
  backend:
    build: .
    ports: ["8080:8080"]
    environment:
      INFERENCE_SERVICE_URL: http://inference:8000
    depends_on:
      inference:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 10
